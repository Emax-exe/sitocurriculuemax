<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .bg { fill: #600000; }
      .gold { stroke: #d4a373; fill: none; }
      .cream { fill: #faedcd; }
      .text { 
        fill: #600000; 
        font-family: Georgia, 'Times New Roman', serif; 
        font-weight: normal; 
      }
    </style>
  </defs>

  <rect width="100" height="100" rx="15" class="bg" />

  <circle cx="50" cy="50" r="45" class="gold" stroke-width="1" />
  
  <circle cx="50" cy="50" r="41" class="gold" stroke-width="1" stroke-dasharray="4 3" />
  
  <circle cx="50" cy="50" r="37" class="gold" stroke-width="1.5" />
  
  <circle cx="50" cy="50" r="32" class="gold" stroke-width="3.5" stroke-dasharray="0 10" stroke-linecap="round" />
  
  <circle cx="50" cy="50" r="28" class="gold" stroke-width="1" />

  <circle cx="50" cy="50" r="26" class="cream" />

  <text x="50" y="59" font-size="26" text-anchor="middle" class="text" letter-spacing="-1">EG</text>
</svg>
